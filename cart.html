<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>APU Eats – Cart</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: #0d1b3e;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .back-btn {
      color: #fff;
      font-size: 18px;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.3px;
    }

    .brand span {
      color: #f5a623;
    }

    .lang-switcher {
      display: flex;
      gap: 4px;
    }

    .lang-btn {
      background: transparent;
      border: 1.5px solid #fff;
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 7px;
      border-radius: 4px;
      cursor: pointer;
    }

    .lang-btn.active {
      background: #f5a623;
      border-color: #f5a623;
      color: #0d1b3e;
    }

    /* ── Progress Steps ── */
    .steps {
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 16px;
      gap: 0;
      border-bottom: 1px solid #e8e8e8;
    }

    .step {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #aaa;
      font-weight: 500;
      flex: 1;
      justify-content: center;
      padding-bottom: 8px;
      border-bottom: 2px solid transparent;
    }

    .step.active {
      color: #0d1b3e;
      border-bottom-color: #0d1b3e;
      font-weight: 700;
    }

    .step-icon {
      font-size: 15px;
    }

    .step-divider {
      width: 32px;
      height: 1px;
      background: #ddd;
      flex-shrink: 0;
      margin-bottom: 8px;
    }

    /* ── Main Content ── */
    main {
      flex: 1;
      padding: 16px 16px 120px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
    }

    /* ── Cart Item Card ── */
    .cart-item {
      background: #fff;
      border-radius: 14px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }

    .item-image {
      width: 64px;
      height: 64px;
      border-radius: 10px;
      object-fit: cover;
      background: #f0f2f5;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }

    .item-info {
      flex: 1;
      min-width: 0;
    }

    .item-name {
      font-size: 15px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 2px;
    }

    .item-variant {
      font-size: 12px;
      color: #888;
      margin-bottom: 6px;
    }

    .item-price {
      font-size: 15px;
      font-weight: 700;
      color: #0d1b3e;
    }

    .qty-control {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .qty-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 1.5px solid #0d1b3e;
      background: transparent;
      color: #0d1b3e;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .qty-btn:active {
      background: #0d1b3e;
      color: #fff;
    }

    .qty-value {
      font-size: 15px;
      font-weight: 700;
      min-width: 16px;
      text-align: center;
    }

    /* ── Order Summary Card ── */
    .summary-card {
      background: #fff;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }

    .summary-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #888;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      color: #444;
      margin-bottom: 10px;
    }

    .summary-divider {
      border: none;
      border-top: 1px solid #eee;
      margin: 12px 0;
    }

    .summary-total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 16px;
      font-weight: 700;
      color: #1a1a2e;
    }

    /* ── Sticky Bottom Button ── */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #fff;
      padding: 12px 16px;
      box-shadow: 0 -2px 12px rgba(0,0,0,0.08);
      z-index: 99;
    }

    .proceed-btn {
      width: 100%;
      background: #0d1b3e;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 15px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.3px;
      transition: background 0.2s;
    }

    .proceed-btn:active {
      background: #1a3260;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <a href="#" class="back-btn">&#8592;</a>
    <div class="brand">APU <span>Eats</span></div>
    <div class="lang-switcher">
      <button class="lang-btn active">EN</button>
      <button class="lang-btn">MY</button>
      <button class="lang-btn">中</button>
    </div>
  </header>

  <!-- Progress Steps -->
  <div class="steps">
    <div class="step active">
      <span class="step-icon">🛒</span> Cart
    </div>
    <div class="step-divider"></div>
    <div class="step">
      <span class="step-icon">📋</span> Summary
    </div>
    <div class="step-divider"></div>
    <div class="step">
      <span class="step-icon">💳</span> Payment
    </div>
  </div>

  <!-- Main -->
  <main>

    <!-- Cart Item 1 -->
    <div class="cart-item">
      <div class="item-image">🍛</div>
      <div class="item-info">
        <div class="item-name">Nasi Lemak Special</div>
        <div class="item-variant">Normal sugar</div>
        <div class="item-price">RM 7.50</div>
      </div>
      <div class="qty-control">
        <button class="qty-btn" onclick="changeQty(this, -1)">−</button>
        <span class="qty-value">1</span>
        <button class="qty-btn" onclick="changeQty(this, 1)">+</button>
      </div>
    </div>

    <!-- Cart Item 2 -->
    <div class="cart-item">
      <div class="item-image">🍚</div>
      <div class="item-info">
        <div class="item-name">Nasi Goreng Kampung</div>
        <div class="item-variant">Normal sugar</div>
        <div class="item-price">RM 7.00</div>
      </div>
      <div class="qty-control">
        <button class="qty-btn" onclick="changeQty(this, -1)">−</button>
        <span class="qty-value">1</span>
        <button class="qty-btn" onclick="changeQty(this, 1)">+</button>
      </div>
    </div>

    <!-- Order Summary -->
    <div class="summary-card">
      <div class="summary-title">Order Summary</div>
      <div class="summary-row">
        <span>Subtotal</span>
        <span id="subtotal">RM 14.50</span>
      </div>
      <div class="summary-row">
        <span>Service Fee</span>
        <span>RM 0.50</span>
      </div>
      <hr class="summary-divider" />
      <div class="summary-total">
        <span>Total</span>
        <span id="total">RM 15.00</span>
      </div>
    </div>

  </main>

  <!-- Sticky Bottom -->
  <div class="bottom-bar">
    <button class="proceed-btn">Proceed to Summary &#8594;</button>
  </div>

  <script>
    const prices = [7.50, 7.00];
    const serviceFee = 0.50;

    function changeQty(btn, delta) {
      const control = btn.parentElement;
      const qtyEl = control.querySelector('.qty-value');
      let qty = parseInt(qtyEl.textContent) + delta;
      if (qty < 1) qty = 1;
      qtyEl.textContent = qty;
      updateSummary();
    }

    function updateSummary() {
      const items = document.querySelectorAll('.cart-item');
      let subtotal = 0;
      items.forEach((item, i) => {
        const qty = parseInt(item.querySelector('.qty-value').textContent);
        subtotal += prices[i] * qty;
      });
      document.getElementById('subtotal').textContent = 'RM ' + subtotal.toFixed(2);
      document.getElementById('total').textContent = 'RM ' + (subtotal + serviceFee).toFixed(2);
    }
  </script>

</body>
</html>
