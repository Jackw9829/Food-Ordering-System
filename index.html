<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>APU Eats — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
  <style>
    body { background: linear-gradient(145deg, #001f4d 0%, #003366 60%, #0055a5 100%); min-height: 100vh; }
    .login-page {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 24px;
    }
    .login-brand {
      text-align: center; margin-bottom: 36px;
    }
    .login-brand .logo-ring {
      width: 80px; height: 80px; border-radius: 50%;
      background: var(--gold); display: flex; align-items: center; justify-content: center;
      font-size: 2rem; margin: 0 auto 14px; font-weight: 800; color: var(--primary);
    }
    .login-brand h1 { color: #fff; font-size: 1.8rem; font-weight: 800; }
    .login-brand h1 span { color: var(--gold); }
    .login-brand p { color: rgba(255,255,255,.65); font-size: .88rem; margin-top: 4px; }
    .login-card {
      background: var(--surface); border-radius: 20px;
      box-shadow: var(--shadow-lg); padding: 28px 24px;
      width: 100%; max-width: 400px;
    }
    .role-tabs {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 8px; margin-bottom: 24px;
    }
    .role-tab {
      padding: 10px 4px; border-radius: var(--radius-sm);
      border: 2px solid var(--border); background: transparent;
      cursor: pointer; text-align: center; transition: all .2s;
      font-family: var(--font);
    }
    .role-tab .role-icon { font-size: 1.4rem; display: block; margin-bottom: 4px; }
    .role-tab .role-name { font-size: .72rem; font-weight: 600; color: var(--text-muted); }
    .role-tab.active {
      border-color: var(--primary); background: #f0f4ff;
    }
    .role-tab.active .role-name { color: var(--primary); }
    .lang-row {
      display: flex; justify-content: center; gap: 8px; margin-bottom: 18px;
    }
    .lang-row .lang-btn {
      color: var(--text-muted); border-color: var(--border); background: transparent;
      padding: 5px 12px; border-radius: 6px; font-size: .78rem; font-weight: 600;
      cursor: pointer; border: 1.5px solid var(--border); transition: all .2s;
    }
    .lang-row .lang-btn.active, .lang-row .lang-btn:hover {
      background: var(--primary); color: #fff; border-color: var(--primary);
    }
    .login-footer { text-align: center; margin-top: 18px; font-size: .8rem; color: var(--text-muted); }
    .login-footer a { color: var(--primary); font-weight: 600; }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-brand">
      <div class="logo-ring">🍜</div>
      <h1>APU <span>Eats</span></h1>
      <p data-i18n="welcomeSub">Order your favourite meal from APU Cafeteria</p>
    </div>

    <div class="login-card">
      <!-- Language switcher -->
      <div class="lang-row">
        <button class="lang-btn active" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="my">MY</button>
        <button class="lang-btn" data-lang="zh">中文</button>
      </div>

      <!-- Role tabs -->
      <div class="role-tabs">
        <button class="role-tab active" id="role-student" onclick="selectRole('student',this)">
          <span class="role-icon">🎓</span>
          <span class="role-name" data-i18n="student">Student / Staff</span>
        </button>
        <button class="role-tab" id="role-vendor" onclick="selectRole('vendor',this)">
          <span class="role-icon">🍳</span>
          <span class="role-name" data-i18n="vendor">Food Vendor</span>
        </button>
        <button class="role-tab" id="role-admin" onclick="selectRole('admin',this)">
          <span class="role-icon">⚙️</span>
          <span class="role-name" data-i18n="admin">Admin</span>
        </button>
      </div>

      <div class="form-group">
        <label class="form-label" data-i18n="email">Email</label>
        <input class="form-control" type="email" data-i18n-placeholder="email" placeholder="student@apu.edu.my" id="emailInput"/>
      </div>
      <div class="form-group">
        <label class="form-label" data-i18n="password">Password</label>
        <input class="form-control" type="password" placeholder="••••••••"/>
      </div>

      <button class="btn btn-primary btn-block" onclick="doLogin()" style="margin-top:8px">
        <span data-i18n="login">Login</span> →
      </button>

      <div class="login-footer">
        <p>Demo credentials: any email &amp; password</p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    let selectedRole = 'student';

    function selectRole(role, el) {
      selectedRole = role;
      document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
    }

    function doLogin() {
      const email = document.getElementById('emailInput').value || 'demo@apu.edu.my';
      sessionStorage.setItem('apu_user', JSON.stringify({ role: selectedRole, email }));
      if (selectedRole === 'vendor') window.location.href = 'vendor.html';
      else if (selectedRole === 'admin') window.location.href = 'admin.html';
      else window.location.href = 'home.html';
    }

    // Allow Enter key
    document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  </script>
</body>
</html>
